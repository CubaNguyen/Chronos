[package]
name = "chronos-parser"
version = "0.1.0"
edition = "2024"
description = "Source code parser for Chronos — extracts AST from multiple languages"
license = "MIT"

[dependencies]
walkdir = "2"

# ─── Tree-sitter ───────────────────────────────────────
tree-sitter = "0.24"
tree-sitter-go = "0.23"

# ─── CLI ───────────────────────────────────────────────
clap = { version = "4", features = ["derive"] }

# ─── Serialization ─────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─── Error handling ────────────────────────────────────
thiserror = "2"

# ─── Hashing ───────────────────────────────────────────
sha2 = "0.10"
hex = "0.4"

# ─── Logging ───────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ─── gRPC stack ────────────────────────────────────────
tonic = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"    
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[build-dependencies]
cc = "1"
tonic-prost-build = "0.14"

[dev-dependencies]
pretty_assertions = "1"

[[bin]]
name = "chronos-parser"
path = "src/main.rs"

[[bin]]
name = "parser-server"
path = "src/bin/parser_server.rs"