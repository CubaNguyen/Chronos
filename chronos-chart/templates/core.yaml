apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-deployment
  namespace: chronos
  labels:
    app: core
spec:
  replicas: {{ .Values.core.replicaCount }}
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      containers:
        - name: core
          image: {{ .Values.core.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: core-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: {{ .Values.core.memoryLimit | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: chronos
spec:
  selector:
    app: core
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
