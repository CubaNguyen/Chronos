apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-user-binding
  namespace: chronos
subjects:
  - kind: ServiceAccount
    name: dev-user # Gán cho thẻ dev-user
    namespace: chronos
roleRef:
  kind: Role
  name: pod-reader # Dán vào chức danh pod-reader
  apiGroup: rbac.authorization.k8s.io

