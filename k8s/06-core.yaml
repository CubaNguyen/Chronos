apiVersion: v1
kind: ConfigMap
metadata:
  name: core-config
  namespace: chronos
data:
  APP_ENV: "production"
  HTTP_PORT: "8080"
  POSTGRES_URL: "postgres://chronos:chronos_password@postgres:5432/chronos_db"
  NEO4J_URL: "bolt://neo4j:7687"
  NATS_URL: "nats://nats:4222"
  RUST_PARSER_ADDR: "parser:50051"
  PYTHON_AI_ADDR: "ai:50052"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: chronos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      containers:
        - name: core
          image: chronos-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: core-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"    # 100m = 0.1 CPU (10% của 1 core)
            limits:
              memory: "256Mi"
              cpu: "500m"    # 500m = 0.5 CPU (50% của 1 core)
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: chronos
spec:
  selector:
    app: core
  ports:
    - port: 8080
      targetPort: 8080
      name: http

