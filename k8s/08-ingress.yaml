apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chronos-ingress
  namespace: chronos
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fe
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: core
                port:
                  number: 8080
