apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-pvc
  namespace: chronos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: chronos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai
          image: chronos-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
              name: grpc
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CHRONOS_DATA_DIR
              value: "/app/data"
            - name: CHRONOS_LLM_MODEL
              value: "gemini/gemini-flash-lite-latest"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chronos-secrets
                  key: GEMINI_API_KEY
          volumeMounts:
            - name: ai-data
              mountPath: /app/data
      volumes:
        - name: ai-data
          persistentVolumeClaim:
            claimName: ai-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: chronos
spec:
  selector:
    app: ai
  ports:
    - port: 50052
      targetPort: 50052
      name: grpc

