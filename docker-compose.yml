services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chronos_postgres
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos_password
      POSTGRES_DB: chronos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Tự động chạy file này khi DB khởi tạo lần đầu

  nats:
    image: nats:latest
    container_name: chronos_nats
    command: ["-js", "-m", "8222"] # Bật JetStream (-js) và Web Monitor (-m 8222)
    ports:
      - "4222:4222" # Port client kết nối (Go, Rust, Python)
      - "8222:8222" # Port HTTP Monitor (Dashboard kiểm tra sức khỏe NATS)
    volumes:
      - nats_data:/data

  neo4j:
    image: neo4j:5-community
    container_name: chronos_neo4j
    ports:
      - "7474:7474" # HTTP Browser UI (giao diện đồ họa http://localhost:7474)
      - "7687:7687" # Bolt protocol (dành cho Go, Python kết nối)
    environment:
      - NEO4J_AUTH=none # Tắt mật khẩu cho môi trường dev (kết nối bolt://localhost:7687 trực tiếp)
      - NEO4J_PLUGINS=["apoc"] # Hỗ trợ thư viện APOC tiện ích cho đồ thị
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  postgres_data:
  nats_data:
  neo4j_data:
  neo4j_logs:
